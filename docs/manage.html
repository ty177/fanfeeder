<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Teams — FanFeeder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="site-nav">
    <a href="index.html" class="nav-logo">Fan<span class="dot">·</span>Feeder</a>
    <ul class="nav-links">
      <li><a href="unsubscribe.html">Unsubscribe</a></li>
      <li><a href="index.html" class="nav-cta">Subscribe</a></li>
    </ul>
  </nav>

  <div class="page-hero">
    <h1>Manage Your Teams</h1>
    <p>Enter your email to load your current teams, then add or remove as needed.</p>
  </div>

  <main>
    <!-- Step 1: email lookup -->
    <section id="lookup-section" class="card">
      <div class="section-label">
        <span class="step-num">1</span>
        <h2>Enter Your Email</h2>
      </div>
      <div id="lookup-form" class="email-row">
        <input type="email" id="lookup-email" class="email-input" placeholder="you@example.com" autocomplete="email">
        <button id="lookup-btn" class="btn-primary">Load My Teams</button>
      </div>
      <p id="lookup-status" class="form-status"></p>
    </section>

    <!-- Step 2: team picker (revealed after lookup) -->
    <section id="picker-section" class="card" style="display:none;">
      <div class="section-label">
        <span class="step-num">2</span>
        <h2>Choose Your Teams</h2>
      </div>
      <p id="current-label" class="note" style="margin-bottom:1rem;"></p>
      <div id="sport-tabs"></div>
      <div id="league-tabs"></div>
      <div id="team-grid"></div>
    </section>

    <section id="selected-section" class="card" style="display:none;">
      <div class="section-label" style="margin-bottom:0.75rem;">
        <h2>Your Teams <span id="selected-count" style="color:var(--text-2);font-weight:500;">(0)</span></h2>
      </div>
      <div id="selected-teams"></div>
    </section>

    <!-- Step 3: save -->
    <section id="save-section" class="card" style="display:none;">
      <div class="section-label">
        <span class="step-num">3</span>
        <h2>Save Changes</h2>
      </div>
      <form id="save-form" action="https://formspree.io/f/mzdawwjk" method="POST">
        <input type="hidden" name="action" value="subscribe">
        <input type="hidden" name="email" id="form-email">
        <input type="hidden" name="teams" id="teams-input">
        <button type="submit" id="submit-btn" class="btn-primary" disabled>Save My Teams</button>
      </form>
      <p id="save-status" class="form-status"></p>
    </section>
  </main>

  <footer>
    <a href="index.html" class="footer-brand">FanFeeder</a>
    <div class="footer-links">
      <a href="index.html">Subscribe</a>
      <a href="unsubscribe.html">Unsubscribe</a>
      <a href="https://github.com/ty177/fanfeeder">GitHub</a>
    </div>
  </footer>

  <script>
  (() => {
    const FORMSPREE_ENDPOINT = "https://formspree.io/f/mzdawwjk";
    const INDEX_URL = "subscribers_index.json";

    let teamsData = null;
    let selectedTeams = new Set();
    let activeSport = 0;
    let activeLeague = 0;

    const lookupEmail    = document.getElementById("lookup-email");
    const lookupBtn      = document.getElementById("lookup-btn");
    const lookupStatus   = document.getElementById("lookup-status");
    const pickerSection  = document.getElementById("picker-section");
    const saveSection    = document.getElementById("save-section");
    const currentLabel   = document.getElementById("current-label");
    const sportTabs      = document.getElementById("sport-tabs");
    const leagueTabs     = document.getElementById("league-tabs");
    const teamGrid       = document.getElementById("team-grid");
    const selectedSection = document.getElementById("selected-section");
    const selectedTeamsEl = document.getElementById("selected-teams");
    const selectedCount  = document.getElementById("selected-count");
    const teamsInput     = document.getElementById("teams-input");
    const formEmailEl    = document.getElementById("form-email");
    const submitBtn      = document.getElementById("submit-btn");
    const saveForm       = document.getElementById("save-form");
    const saveStatus     = document.getElementById("save-status");

    const params = new URLSearchParams(window.location.search);
    const preEmail = params.get("email");
    if (preEmail) lookupEmail.value = preEmail;

    async function sha256hex(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function loadTeams() {
      if (teamsData) return;
      const resp = await fetch("teams.json");
      teamsData = await resp.json();
    }

    lookupBtn.addEventListener("click", async () => {
      const raw = lookupEmail.value.trim().toLowerCase();
      if (!raw) { lookupStatus.textContent = "Please enter your email."; lookupStatus.className = "form-status status-error"; return; }

      lookupBtn.disabled = true;
      lookupStatus.textContent = "Looking up your subscription…";
      lookupStatus.className = "form-status";

      try {
        await loadTeams();
        const hash = await sha256hex(raw);
        const indexResp = await fetch(INDEX_URL + "?_=" + Date.now());
        let currentTeams = [];
        if (indexResp.ok) {
          const index = await indexResp.json();
          currentTeams = index[hash] || [];
        }

        formEmailEl.value = raw;
        selectedTeams = new Set(currentTeams);

        currentLabel.textContent = currentTeams.length > 0
          ? `Found ${currentTeams.length} team${currentTeams.length !== 1 ? "s" : ""} on your subscription — update below and save.`
          : "No active subscription found for that email. Pick teams below to subscribe.";

        lookupStatus.textContent = "";
        pickerSection.style.display = "block";
        saveSection.style.display = "block";
        renderSportTabs();
        selectSport(0);
        renderSelected();
        updateForm();
      } catch {
        lookupStatus.textContent = "Something went wrong. Please try again.";
        lookupStatus.className = "form-status status-error";
        lookupBtn.disabled = false;
      }
    });

    lookupEmail.addEventListener("keydown", e => { if (e.key === "Enter") lookupBtn.click(); });

    function renderSportTabs() {
      sportTabs.innerHTML = "";
      teamsData.sports.forEach((sport, i) => {
        const tab = document.createElement("button");
        tab.className = "tab";
        tab.textContent = sport.name;
        tab.addEventListener("click", () => selectSport(i));
        sportTabs.appendChild(tab);
      });
    }

    function selectSport(index) {
      activeSport = index;
      document.querySelectorAll("#sport-tabs .tab").forEach((t, i) => t.classList.toggle("active", i === index));
      renderLeagueTabs();
      selectLeague(0);
    }

    function renderLeagueTabs() {
      leagueTabs.innerHTML = "";
      teamsData.sports[activeSport].leagues.forEach((league, i) => {
        const tab = document.createElement("button");
        tab.className = "tab";
        if (league.logo_url) {
          tab.classList.add("tab-logo");
          const img = document.createElement("img");
          img.src = league.logo_url; img.alt = league.name; img.title = league.name; img.className = "league-logo";
          img.onerror = function () { this.remove(); tab.textContent = league.name; tab.classList.remove("tab-logo"); };
          tab.appendChild(img);
        } else {
          tab.textContent = league.name;
        }
        tab.addEventListener("click", () => selectLeague(i));
        leagueTabs.appendChild(tab);
      });
    }

    function selectLeague(index) {
      activeLeague = index;
      document.querySelectorAll("#league-tabs .tab").forEach((t, i) => t.classList.toggle("active", i === index));
      renderTeamGrid();
    }

    function renderTeamGrid() {
      teamGrid.innerHTML = "";
      [...teamsData.sports[activeSport].leagues[activeLeague].teams]
        .sort((a, b) => a.name.localeCompare(b.name))
        .forEach(team => {
          const card = document.createElement("div");
          card.className = "team-card" + (selectedTeams.has(team.id) ? " selected" : "");
          card.style.backgroundColor = team.primary_color;
          card.style.color = team.text_color;
          const label = document.createElement("span");
          label.className = "team-label";
          label.textContent = team.short_name;
          if (team.logo_url) {
            const img = document.createElement("img");
            img.src = team.logo_url; img.alt = team.short_name; img.className = "team-logo"; img.loading = "lazy";
            img.onerror = function () { this.style.display = "none"; label.classList.add("no-logo"); };
            card.appendChild(img);
          } else {
            label.classList.add("no-logo");
          }
          card.appendChild(label);
          card.addEventListener("click", () => toggleTeam(team));
          teamGrid.appendChild(card);
        });
    }

    function toggleTeam(team) {
      if (selectedTeams.has(team.id)) selectedTeams.delete(team.id);
      else selectedTeams.add(team.id);
      renderTeamGrid();
      renderSelected();
      updateForm();
    }

    function findTeam(id) {
      for (const sport of teamsData.sports)
        for (const league of sport.leagues) {
          const t = league.teams.find(t => t.id === id);
          if (t) return t;
        }
      return null;
    }

    function renderSelected() {
      if (selectedTeams.size === 0) { selectedSection.style.display = "none"; return; }
      selectedSection.style.display = "block";
      selectedCount.textContent = "(" + selectedTeams.size + ")";
      selectedTeamsEl.innerHTML = "";
      selectedTeams.forEach(id => {
        const team = findTeam(id);
        if (!team) return;
        const chip = document.createElement("span");
        chip.className = "selected-chip";
        chip.style.backgroundColor = team.primary_color;
        chip.style.color = team.text_color;
        const logoHtml = team.logo_url ? `<img src="${team.logo_url}" alt="" class="chip-logo">` : "";
        chip.innerHTML = `${logoHtml}${team.short_name} <span class="remove">&times;</span>`;
        chip.querySelector(".remove").addEventListener("click", () => toggleTeam(team));
        selectedTeamsEl.appendChild(chip);
      });
    }

    function updateForm() {
      teamsInput.value = Array.from(selectedTeams).join(",");
      submitBtn.disabled = selectedTeams.size === 0;
    }

    saveForm.addEventListener("submit", async e => {
      e.preventDefault();
      submitBtn.disabled = true;
      saveStatus.textContent = "Saving…";
      saveStatus.className = "form-status";
      try {
        const resp = await fetch(FORMSPREE_ENDPOINT, {
          method: "POST",
          body: new FormData(saveForm),
          headers: { Accept: "application/json" },
        });
        if (resp.ok) {
          saveStatus.textContent = "Saved! Your digest will reflect these teams on the next send.";
          saveStatus.className = "form-status status-success";
        } else { throw new Error(); }
      } catch {
        saveStatus.textContent = "Something went wrong. Please try again.";
        saveStatus.className = "form-status status-error";
        submitBtn.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
