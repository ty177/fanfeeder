<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsubscribe — FanFeeder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="site-nav">
    <a href="index.html" class="nav-logo">Fan<span class="dot">·</span>Feeder</a>
    <ul class="nav-links">
      <li><a href="manage.html">Manage Teams</a></li>
      <li><a href="index.html" class="nav-cta">Subscribe</a></li>
    </ul>
  </nav>

  <div class="page-hero">
    <h1>Unsubscribe</h1>
    <p>Sorry to see you go. Enter your email to stop receiving digests.</p>
  </div>

  <main style="max-width:520px;">
    <div class="card">
      <form id="unsub-form" action="https://formspree.io/f/mzdawwjk" method="POST">
        <input type="hidden" name="_subject" value="Unsubscribe Request">
        <input type="hidden" name="action" value="unsubscribe">
        <div class="email-row">
          <input type="email" name="email" id="email-input" class="email-input" placeholder="you@example.com" required>
          <button type="submit" id="submit-btn" class="btn-primary" style="background:#ef4444;">Unsubscribe</button>
        </div>
      </form>
      <p id="form-status" class="form-status"></p>
    </div>

    <p style="text-align:center;margin-top:1rem;font-size:0.8rem;color:var(--text-2);">
      Changed your mind? <a href="manage.html" style="color:var(--accent);text-decoration:none;font-weight:600;">Update your teams instead →</a>
    </p>
  </main>

  <footer>
    <a href="index.html" class="footer-brand">FanFeeder</a>
    <div class="footer-links">
      <a href="manage.html">Manage Teams</a>
      <a href="index.html">Subscribe</a>
      <a href="https://github.com/ty177/fanfeeder">GitHub</a>
    </div>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const preEmail = params.get("email");
    if (preEmail) document.getElementById("email-input").value = preEmail;

    document.getElementById("unsub-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const status = document.getElementById("form-status");
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      status.textContent = "Processing…";
      status.className = "form-status";
      try {
        const resp = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: { Accept: "application/json" }
        });
        if (resp.ok) {
          status.textContent = "You've been unsubscribed. You won't receive any more digests.";
          status.className = "form-status status-success";
        } else { throw new Error(); }
      } catch {
        status.textContent = "Something went wrong. Please try again.";
        status.className = "form-status status-error";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
