name: Sports News Digest

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Send only to this email (leave blank for all subscribers)"
        required: false
        default: ""

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Restore seen-stories cache
        uses: actions/cache@v4
        with:
          path: .seen_cache.json
          key: seen-cache-${{ github.run_id }}
          restore-keys: |
            seen-cache-

      - name: Sync subscribers from Formspree
        env:
          FORMSPREE_API_KEY: ${{ secrets.FORMSPREE_API_KEY }}
          FORMSPREE_FORM_ID: ${{ secrets.FORMSPREE_FORM_ID }}
        working-directory: src
        run: python process_subscription.py
        continue-on-error: true

      - name: Commit subscriber updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/subscribers.json docs/subscribers_index.json
          git diff --staged --quiet || git commit -m "Auto-update subscribers"
          git push || true
        continue-on-error: true

      - name: Send digest email
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        working-directory: src
        run: |
          EMAIL_FILTER="${{ github.event.inputs.email }}"
          if [ -n "$EMAIL_FILTER" ]; then
            python main.py --email "$EMAIL_FILTER"
          else
            python main.py
          fi
